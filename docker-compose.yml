version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: notification_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notification_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: notification_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    image: your-dockerhub-username/smart-notify-backend:latest
    container_name: notification_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/notification_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    image: your-dockerhub-username/smart-notify-frontend:latest
    container_name: notification_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend